<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tôligo Livreur — Signaler un problème</title>
<!-- Maquette Tôligo : LV07 · Signaler un problème de box -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#121212}a:hover{color:#000000}
button{font:inherit;cursor:pointer}
input,textarea{font:inherit}
input::placeholder,textarea::placeholder{color:#76767C}
</style>
<style>
body{margin:0;min-height:100vh;background:#E9E9EC;display:flex;justify-content:center;align-items:flex-start;padding:32px 16px;box-sizing:border-box}
.ecran{border-radius:44px;overflow:hidden;box-shadow:0 24px 60px rgba(18,18,18,0.18);flex-shrink:0}
</style>
</head>
<body>
<div class="ecran">
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'DM Sans', sans-serif; color: #121212; box-sizing: border-box">
  <div style="padding: 56px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <a href="LV-Ram-Passage.html" aria-label="Fermer" style="width: 44px; height: 44px; border-radius: 50%; background: #F5F5F6; display: flex; align-items: center; justify-content: center; color: #121212; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
      <span style="display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0"><span style="font-family: 'Sora', sans-serif; font-weight: 600; font-size: 17px">Signaler un problème</span><span style="font-size: 12.5px; color: #616168; white-space: nowrap">Entrepôt Angré Château</span></span>
      <span style="width: 44px"></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 12.5px; font-weight: 700; color: #616168; letter-spacing: 0.7px">QUEL BOX ?</span></div>
      <div style="display: flex; gap: 8px"><button type="button" aria-pressed="false" style="height: 44px; padding: 0 18px; border-radius: 999px; border: 0; background: #F5F5F6; color: #121212; font-size: 14px; font-weight: 600">R-021</button><button type="button" aria-pressed="false" style="height: 44px; padding: 0 18px; border-radius: 999px; border: 0; background: #F5F5F6; color: #121212; font-size: 14px; font-weight: 600">R-022</button><button type="button" aria-pressed="true" style="height: 44px; padding: 0 18px; border-radius: 999px; border: 0; background: #121212; color: #FFFFFF; font-size: 14px; font-weight: 700">R-025</button></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 12.5px; font-weight: 700; color: #616168; letter-spacing: 0.7px">PROBLÈME</span></div>
      <div role="radiogroup" aria-label="Problème" style="display: flex; flex-direction: column; gap: 8px">
        <button role="radio" aria-checked="true" style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 22px; border: 2px solid #121212; background: #F8F8F9; text-align: left; color: #121212; width: 100%">
          <span style="width: 38px; height: 38px; border-radius: 50%; background: #121212; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></span>
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-size: 14.5px; font-weight: 600">Le box ne s’ouvre pas</span></span>
          <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; border: 7px solid #121212; box-sizing: border-box; flex-shrink: 0; background: #FFFFFF"></span>
        </button>
        <button role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 22px; border: 1px solid #F0F0F2; box-shadow: 0 8px 24px rgba(18,18,18,0.06); background: #FFFFFF; text-align: left; color: #121212; width: 100%">
          <span style="width: 38px; height: 38px; border-radius: 50%; background: #F5F5F6; color: #121212; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"></path><path d="m3 8 9 5 9-5M12 13v8"></path></svg></span>
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-size: 14.5px; font-weight: 600">Un colis manque</span></span>
          <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; border: 2px solid #CBCBD0; box-sizing: border-box; flex-shrink: 0"></span>
        </button>
        <button role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 22px; border: 1px solid #F0F0F2; box-shadow: 0 8px 24px rgba(18,18,18,0.06); background: #FFFFFF; text-align: left; color: #121212; width: 100%">
          <span style="width: 38px; height: 38px; border-radius: 50%; background: #F5F5F6; color: #121212; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20z"></path><path d="M12 10v4M12 17v.01"></path></svg></span>
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-size: 14.5px; font-weight: 600">Box endommagé</span></span>
          <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; border: 2px solid #CBCBD0; box-sizing: border-box; flex-shrink: 0"></span>
        </button>
        <button role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 22px; border: 1px solid #F0F0F2; box-shadow: 0 8px 24px rgba(18,18,18,0.06); background: #FFFFFF; text-align: left; color: #121212; width: 100%">
          <span style="width: 38px; height: 38px; border-radius: 50%; background: #F5F5F6; color: #121212; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 7.5v.01"></path></svg></span>
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-size: 14.5px; font-weight: 600">Autre problème</span></span>
          <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; border: 2px solid #CBCBD0; box-sizing: border-box; flex-shrink: 0"></span>
        </button>
      </div>
    </div>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13.5px; font-weight: 600">Décrivez le problème</span>
      <textarea rows="2" style="border-radius: 18px; border: 0; background: #F5F5F6; padding: 12px 16px; font-size: 15px; color: #121212; resize: none; box-sizing: border-box; line-height: 1.4; outline: none">Le box reste fermé avec l’application TTLock.</textarea>
    </label>
    <div style="display: flex; gap: 10px; padding: 12px 14px; border-radius: 18px; background: #F5F5F6">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 7.5v.01"></path></svg>
      <span style="font-size: 13px; line-height: 1.45; color: #3F3F45">Un incident est ouvert. Les colis de ce box restent en place pour la tournée suivante.</span>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 20px 34px; background: #FFFFFF; border-radius: 28px 28px 0 0; box-shadow: 0 -8px 28px rgba(18,18,18,0.07); display: flex; flex-direction: column; gap: 8px">
    <a href="LV-Ram-Passage.html" style="height: 56px; border-radius: 999px; background: #B42318; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-weight: 600; font-size: 16px"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20z"></path><path d="M12 10v4M12 17v.01"></path></svg> Signaler le problème</a>
  </div>
</div>
</div>
</body>
</html>
